services:
  web:
    build: .
    # This command applies any pending migrations, compiles translations, and starts the development server
    command: >
      sh -c "python manage.py migrate &&
             mkdir -p locale &&
             python manage.py compilemessages &&
             python manage.py collectstatic --noinput &&
             uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --reload"
    expose:
      - "8000"
    restart: always
    volumes:
      # Mounts the current directory to /app in the container for live-reloading during development
      # This also persists your local db.sqlite3 file
      - .:/app
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=core.settings

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    restart: always
    environment:
      DOMAIN: ${DOMAIN:-new.apap.kg}
    volumes:
      - .:/app:ro
      - ./nginx/app.conf:/etc/nginx/snippets/app.conf:ro
      - ./nginx/http.conf.template:/etc/nginx/source-templates/http.conf.template:ro
      - ./nginx/https.conf.template:/etc/nginx/source-templates/https.conf.template:ro
      - ./nginx/start.sh:/usr/local/bin/start-nginx:ro
      # Bind mounts keep certificates on the host even if Docker is removed.
      - ${CERTBOT_DATA_DIR:-./certbot}/www:/var/www/certbot:ro
      - ${CERTBOT_DATA_DIR:-./certbot}/letsencrypt:/etc/letsencrypt:ro
    command: ["/bin/sh", "/usr/local/bin/start-nginx"]
    depends_on:
      - web

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-new.apap.kg}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-contact@agupkr.kg}
    volumes:
      - ${CERTBOT_DATA_DIR:-./certbot}/www:/var/www/certbot
      - ${CERTBOT_DATA_DIR:-./certbot}/letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        until certbot certonly --webroot --webroot-path /var/www/certbot \
          --domain "$${DOMAIN}" --email "$${CERTBOT_EMAIL}" \
          --agree-tos --non-interactive --keep-until-expiring; do
          echo "Certificate request failed; retrying in 60 seconds..."
          sleep 60
        done
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet
          sleep 12h
        done
    depends_on:
      - nginx
